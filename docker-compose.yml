services:
  api:
    build:
      context: ./CRM-Backend
    container_name: crm-compact-api
    restart: unless-stopped
    environment:
      DATABASE_URL: ${DATABASE_URL}
      DIRECT_URL: ${DIRECT_URL}
      PORT: 3333
    ports:
      - "3333:3333"

  frontend:
    build:
      context: ./CRM-Frontend
      args:
        VITE_API_URL: ${VITE_API_URL:-http://localhost:3333}
    container_name: crm-compact-frontend
    restart: unless-stopped
    depends_on:
      - api
    ports:
      - "8080:80"
