services:
  api:
    build:
      context: ./CRM-Backend
    container_name: crm-compact-api
    restart: unless-stopped
    environment:
      TZ: America/Sao_Paulo
      DATABASE_URL: ${DATABASE_URL}
      DIRECT_URL: ${DIRECT_URL}
      SUPABASE_URL: ${SUPABASE_URL}
      SUPABASE_SERVICE_ROLE_KEY: ${SUPABASE_SERVICE_ROLE_KEY}
      SUPABASE_AVATARS_BUCKET: ${SUPABASE_AVATARS_BUCKET}
      PORT: 3333
    ports:
      - "3333:3333"
    #depends_on:
    #  - postgres

  frontend:
    build:
      context: ./CRM-Frontend
      args:
        VITE_API_URL: ${VITE_API_URL:-http://localhost:3333}
    container_name: crm-compact-frontend
    restart: unless-stopped
    depends_on:
      - api
    ports:
      - "8080:80"

